<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contador</title>
  <style>
   
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background-color: red;
    }
    h1 {
      font-size: 60px;
    }
    #contador {
      font-size: 60px;
      color: red;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>TE HE HACKEADO PUTO IDIOTA</h1>
  <div id="contador">Cargando...</div>

  <script>
    // Cambia "miweb123" por un nombre único si quieres
    fetch("https://api.countapi.xyz/hit/miweb123/visitas")
      .then(res => res.json())
      .then(data => {
        document.getElementById("contador").innerText = data.value;
      });

    
const frases = [
  "IVAN TE HE ESTADO OBSERVANDO",
  "TENGO FOTOS TUYAS COMPROMETIDAS ....",
  "BESANDOTE CON URBANEJA",
  "LAS BORRO POR 1 MILLLAR DE DOLARES"
];

let i = 0;

function mostrarTexto() {
  if (i < frases.length) {
    document.getElementById("texto").innerText = frases[i];
    i++;
    setTimeout(mostrarTexto, 2000); // 2 segundos
  }
}

mostrarTexto();

  </script>

</body>
</html>
