<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
 <title>enlacepanchitomalicioso</title>
  <style>
    
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background-color: red;
    }
    h1 {
      font-size: 60px;
    }
    #contador {
      font-size: 60px;
      color: red;
      margin-top: 20px;
    }
  </style>
</head>
  
<audio id="alarma" loop>
  https://www.soundjay.com/misc/sounds/alarm-clock-01.mp3
</audio>

<body>

  <h1>TE HE HACKEADO PUTO IDIOTA</h1>
  <div id="contador">Cargando...</div>
  <h1 id="texto"></h1>
  <h2 style="color:red;">HAZ CLICK PARA ACTIVAR LA ALARMA</h2> 
  <script>

    
    // Cambia "miweb123" por un nombre único si quieres
    fetch("https://api.countapi.xyz/hit/miweb123/visitas")
      .then(res => res.json())
      .then(data => {
        document.getElementById("contador").innerText = data.value;
      });

const audio = document.getElementById("alarma");

  document.body.addEventListener("click", function() {
    audio.volume = 1.0;
    audio.play();
  });

    

const frases = [
  "IVAN TE HE ESTADO OBSERVANDO",
  "TENGO FOTOS TUYAS COMPROMETIDAS ....",
  "BESANDOTE CON URBANEJA",
  "SI QUIERES TE LAS PASO",
  "PAGAME 2000 DOLARES"
];

let i = 0;

function mostrarTexto() {
  if (i < frases.length) {
    document.getElementById("texto").innerText = frases[i];
    i++;
    setTimeout(mostrarTexto, 2000);
  }
}

mostrarTexto();




  </script>

</body>
</html>
